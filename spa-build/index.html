<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KisanAI — Smart On-Device Crop Disease &amp; Health Intelligence</title>
    <meta name="theme-color" content="#0f1a14" />
    <meta name="description" content="KisanAI provides instant on-device computer vision diagnosis and agronomic guidance for rice and chilli crops." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <div id="app-loading-splash" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f1a14;color:#fff;font-family:system-ui,-apple-system,sans-serif;transition:opacity 0.4s ease;user-select:none;">
      <div style="width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,#10b981,#047857);display:grid;place-items:center;box-shadow:0 12px 30px rgba(16,185,129,0.45);animation:kisanPulse 1.6s infinite ease-in-out;">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      </div>
      <div style="font-size:26px;font-weight:800;margin-top:16px;letter-spacing:-0.5px;">Kisan<span style="color:#10b981;">AI</span></div>
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#10b981;margin-top:3px;">Offline Vision &amp; LLM</div>
      <div style="width:140px;height:4px;background:rgba(255,255,255,0.15);border-radius:99px;margin-top:24px;overflow:hidden;">
        <div style="width:100%;height:100%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:99px;animation:kisanLoadBar 1.2s infinite ease-in-out;"></div>
      </div>
      <div style="font-size:11px;color:#94a3b8;margin-top:12px;font-family:monospace;">READYING OFFLINE AI</div>
      <style>
        @keyframes kisanPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }
        @keyframes kisanLoadBar { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
      </style>
    </div>
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var splash = document.getElementById('app-loading-splash');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.pointerEvents = 'none';
            setTimeout(function() { splash.remove(); }, 400);
          }
        }, 700);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="../src/main.tsx"></script>
  </body>
</html>
