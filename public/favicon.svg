<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="#09140f" />
  <path d="M 256,44 C 360,44 436,80 436,80 C 436,260 370,390 256,468 C 142,390 76,260 76,80 C 76,80 152,44 256,44 Z"
        fill="url(#shieldGrad)" opacity="0.18" />

  <!-- Shield Border with AI Circuit Glow -->
  <path d="M 256,60 C 348,60 416,92 416,92 C 416,252 356,370 256,444 C 156,370 96,252 96,92 C 96,92 164,60 256,60 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Sunbeam Seed of Growth -->
  <circle cx="256" cy="115" r="22" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="256" cy="115" r="14" fill="#fef3c7" />

  <!-- Stylized AI Leaf -->
  <path d="M 256,150 C 170,190 140,290 180,365 C 215,425 256,410 256,410 C 256,410 297,425 332,365 C 372,290 342,190 256,150 Z"
        fill="url(#shieldGrad)" />

  <!-- Inner Leaf Highlights & Venation -->
  <path d="M 256,160 Q 256,290 256,400" stroke="url(#leafGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 256,230 Q 210,215 190,245" stroke="url(#leafGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M 256,270 Q 302,255 322,285" stroke="url(#leafGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M 256,310 Q 218,300 205,330" stroke="url(#leafGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M 256,350 Q 294,340 307,370" stroke="url(#leafGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9" />

  <!-- AI Neural Nodes -->
  <circle cx="190" cy="245" r="7" fill="#6ee7b7" />
  <circle cx="322" cy="285" r="7" fill="#6ee7b7" />
  <circle cx="205" cy="330" r="7" fill="#6ee7b7" />
  <circle cx="307" cy="370" r="7" fill="#6ee7b7" />

  <!-- Corner Vision AI Brackets -->
  <path d="M 140,110 L 110,110 L 110,140" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <path d="M 372,110 L 402,110 L 402,140" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <path d="M 110,380 L 110,410 L 140,410" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <path d="M 402,380 L 402,410 L 372,410" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
</svg>

